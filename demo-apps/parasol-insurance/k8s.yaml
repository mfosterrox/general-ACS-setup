apiVersion: v1
kind: Namespace
metadata:
  name: parasol-insurance
  labels:
    app: parasol-insurance
---
apiVersion: v1
kind: Service
metadata:
  name: parasol-insurance
  namespace: parasol-insurance
  labels:
    app: parasol-insurance
spec:
  selector:
    app: parasol-insurance
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parasol-insurance
  namespace: parasol-insurance
  labels:
    app: parasol-insurance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parasol-insurance
  template:
    metadata:
      labels:
        app: parasol-insurance
    spec:
      containers:
        - name: parasol-insurance
          image: quay.io/jfalkner1/parasol-insurance:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: parasol-insurance
  namespace: parasol-insurance
  labels:
    app: parasol-insurance
spec:
  to:
    kind: Service
    name: parasol-insurance
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
